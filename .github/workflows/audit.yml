name: Audit formula

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: brew audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f9676f1ffe2e1a720f81b2c54c51cfb99915ec14 # main, 2026-10-14

      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          # Until the first prod release populates Formula/, there's
          # nothing to audit — exit cleanly so new empty taps pass CI.
          shopt -s nullglob
          formulas=(Formula/*.rb)
          if (( ${#formulas[@]} == 0 )); then
            echo "No formulas to audit yet."
            exit 0
          fi
          brew audit --strict --online "${formulas[@]}"

      - name: Formula syntax + style
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          formulas=(Formula/*.rb)
          if (( ${#formulas[@]} == 0 )); then
            exit 0
          fi
          brew style "${formulas[@]}"
