name: Audit formula

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: brew audit
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Taps this checkout as agent-labs-dev/nebula (tap-name output).
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@f9676f1ffe2e1a720f81b2c54c51cfb99915ec14 # main, 2026-10-14

      - name: Audit
        shell: bash
        env:
          TAP: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          set -euo pipefail
          # Until the first prod release populates Formula/, there's
          # nothing to audit — exit cleanly so new empty taps pass CI.
          shopt -s nullglob
          formulas=(Formula/*.rb)
          if (( ${#formulas[@]} == 0 )); then
            echo "No formulas to audit yet."
            exit 0
          fi
          # brew audit takes formula names, not paths.
          names=()
          for formula in "${formulas[@]}"; do
            names+=("$TAP/$(basename "$formula" .rb)")
          done
          brew audit --strict --online "${names[@]}"

      - name: Formula syntax + style
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          formulas=(Formula/*.rb)
          if (( ${#formulas[@]} == 0 )); then
            exit 0
          fi
          brew style "${formulas[@]}"
